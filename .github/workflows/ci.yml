name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install -g pnpm@9.15.5
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/check_release.py

  proxy-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: false
      - run: pip install -r requirements-dev.txt
      - run: python scripts/build_proxy_core.py --platforms linux/amd64
      - name: Prepare pinned Mihomo for AnyTLS client interoperability
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz -o /tmp/mihomo.gz
          echo 'cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84  /tmp/mihomo.gz' | sha256sum -c -
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod 755 /tmp/mihomo
      - name: Real AnyTLS, chained egress, per-user statistics and revocation
        run: SING_BOX_BINARY="$PWD/agent/bin/sing-box-linux-amd64" MIHOMO_BINARY=/tmp/mihomo python -m pytest tests/test_proxy_runtime.py -q
      - run: bash -n agent/install.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install -g pnpm@9.15.5
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sub-manager:ci
          build-args: |
            BUILD_REVISION=${{ github.sha }}
      - name: Start isolated container and wait for dependencies
        shell: bash
        run: |
          docker run -d --name sub-manager-ci -p 127.0.0.1:17779:7777 sub-manager:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:17779/api/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pip install httpx
      - run: python scripts/container_smoke.py
      - name: Stop disposable test container
        if: always()
        run: docker rm -f sub-manager-ci
