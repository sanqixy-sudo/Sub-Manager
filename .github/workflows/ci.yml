name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip install -r requirements-dev.txt
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee pytest-output.txt
          test_status=${PIPESTATUS[0]}
          {
            echo '### Backend test output'
            echo '```text'
            cat pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$test_status" -ne 0 ]; then
            diagnostic=$(tail -c 6000 pytest-output.txt)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            echo "::error file=tests,title=pytest diagnostic::$diagnostic"
          fi
          exit "$test_status"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
