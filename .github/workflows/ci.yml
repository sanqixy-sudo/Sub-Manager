name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install -g pnpm@9.15.5
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/check_release.py

  proxy-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: false
      - run: pip install -r requirements-dev.txt
      - run: python scripts/build_proxy_core.py --platforms linux/amd64
      - name: Prepare pinned Mihomo for AnyTLS client interoperability
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-linux-amd64-v1.19.30.gz -o /tmp/mihomo.gz
          echo 'cf06ce2c7d1421bdbda14ee4a5b6046672dc35ebf8eecd8e77504ec3c0ed9a84  /tmp/mihomo.gz' | sha256sum -c -
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod 755 /tmp/mihomo
      - name: Real AnyTLS, chained egress, per-user statistics and revocation
        run: SING_BOX_BINARY="$PWD/agent/bin/sing-box-linux-amd64" MIHOMO_BINARY=/tmp/mihomo python -m pytest tests/test_proxy_runtime.py -q
      - run: bash -n agent/install.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install -g pnpm@9.15.5
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sub-manager:ci
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
      - name: Start isolated container and wait for dependencies
        shell: bash
        run: |
          docker run -d --name sub-manager-ci -p 127.0.0.1:17779:7777 sub-manager:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:17779/api/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pip install httpx
      - run: python scripts/container_smoke.py
      - name: Stop disposable test container
        if: always()
        run: docker rm -f sub-manager-ci

  publish:
    name: Publish versioned multi-platform image
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [backend, proxy-runtime, frontend, container]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify tag and select image
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match VERSION."
            exit 1
          fi
          echo "RELEASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.RELEASE_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=container-amd64
            type=gha,scope=container-arm64
      - name: Verify versioned image on GHCR
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$RELEASE_IMAGE" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | contains(["amd64", "arm64"])'
          docker pull --platform linux/amd64 "$RELEASE_IMAGE"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$RELEASE_IMAGE")" = "$GITHUB_SHA"
          docker buildx imagetools inspect "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
