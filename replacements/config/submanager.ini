[custom]
; Sub Manager V3 fixed rule preset: 大陆直连，其他代理
; This is intentionally simple and cross-client friendly.
; Client applications can still switch Rule / Global / Direct mode themselves.

; Self-contained rules: conversion must not depend on GitHub availability.
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOSITE,CN
ruleset=DIRECT,[]GEOIP,CN

; Everything else -> user-selected proxy group
ruleset=PROXY,[]FINAL

; Keep only two useful groups. No country/media/landing-line groups.
custom_proxy_group=PROXY`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
